<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Category Form</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 th:text="${category.id == null ? 'Create Category' : 'Edit Category'}">Form</h2>

        <form th:action="${category.id == null ? '/admin/categories/create' : '/admin/categories/edit/' + category.id}" 
              th:object="${category}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}" />

            <div>
                <label>Name:</label>
                <input type="text" th:field="*{name}" />
                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></span>
            </div>

            <div>
                <label>Description:</label>
                <textarea th:field="*{description}" rows="4" cols="50"></textarea>
                <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="error"></span>
            </div>

            <div>
                <label>Category Image:</label>
                <div th:if="${category.image != null and !category.image.isEmpty()}">
                    <p>Current image: <img th:src="@{'/uploads/' + ${category.image}}" width="100" /></p>
                </div>
                <input type="file" name="imageFile" accept="image/*" />
            </div>

            <button type="submit">Save</button>
            <a th:href="@{/admin/categories}">Cancel</a>
        </form>
    </div>
</body>
</html>
