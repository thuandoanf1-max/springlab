<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Manage Categories</title>
</head>
<body>
    <div layout:fragment="content">
        <h2>Manage Categories</h2>

        <form th:action="@{/admin/categories}" method="get">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by name..." />
            <button type="submit">Search</button>
        </form>
        <br/>
        <a th:href="@{/admin/categories/create}">Create New Category</a>

        <div th:if="${categoryPage == null or categoryPage.isEmpty()}">
            <p>No results found.</p>
        </div>

        <table th:if="${categoryPage != null and !categoryPage.isEmpty()}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${categoryPage.content}">
                    <td th:text="${item.id}"></td>
                    <td>
                        <img th:if="${item.image != null and !item.image.isEmpty()}" 
                             th:src="@{'/uploads/' + ${item.image}}" width="50" height="50" style="object-fit: cover;" />
                    </td>
                    <td th:text="${item.name}"></td>
                    <td th:text="${item.description}"></td>
                    <td>
                        <a th:href="@{/admin/categories/edit/{id}(id=${item.id})}">Edit</a> |
                        <a th:href="@{/admin/categories/delete/{id}(id=${item.id})}" onclick="return confirm('Are you sure?');">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="pagination" th:if="${categoryPage != null and categoryPage.totalPages > 0}">
            <a th:if="${categoryPage.hasPrevious()}"
               th:href="@{/admin/categories(keyword=${keyword}, page=${categoryPage.number - 1}, size=${categoryPage.size})}">Previous</a>

            <th:block th:each="i : ${#numbers.sequence(0, categoryPage.totalPages - 1)}">
                <span th:if="${i == categoryPage.number}" class="current" th:text="${i + 1}"></span>
                <a th:if="${i != categoryPage.number}"
                   th:href="@{/admin/categories(keyword=${keyword}, page=${i}, size=${categoryPage.size})}"
                   th:text="${i + 1}"></a>
            </th:block>

            <a th:if="${categoryPage.hasNext()}"
               th:href="@{/admin/categories(keyword=${keyword}, page=${categoryPage.number + 1}, size=${categoryPage.size})}">Next</a>
        </div>
    </div>
</body>
</html>
