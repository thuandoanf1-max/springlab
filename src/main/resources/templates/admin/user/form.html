<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>User Form</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 th:text="${user.id == null ? 'Create User' : 'Edit User'}">Form</h2>

        <form th:action="${user.id == null ? '/admin/users/create' : '/admin/users/edit/' + user.id}"
              th:object="${user}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div>
                <label>Username:</label>
                <input type="text" th:field="*{username}" />
                <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error"></span>
            </div>

            <div th:if="${user.id == null}">
                <label>Password:</label>
                <input type="password" th:field="*{password}" />
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></span>
            </div>

            <div>
                <label>Fullname:</label>
                <input type="text" th:field="*{fullname}" />
                <span th:if="${#fields.hasErrors('fullname')}" th:errors="*{fullname}" class="error"></span>
            </div>

            <div>
                <label>Email:</label>
                <input type="text" th:field="*{email}" />
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></span>
            </div>

            <div>
                <label>Role:</label>
                <select th:field="*{role}">
                    <option value="ADMIN">ADMIN</option>
                    <option value="USER">USER</option>
                </select>
                <span th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="error"></span>
            </div>

            <button type="submit">Save</button>
            <a th:href="@{/admin/users}">Cancel</a>
        </form>
    </div>
</body>
</html>
