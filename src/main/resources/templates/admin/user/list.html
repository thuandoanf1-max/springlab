<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Manage Users</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <div class="page-heading">
            <span class="page-icon"><i class="bi bi-people"></i></span>
            <div><p class="eyebrow">Access control</p><h1>Users</h1><p>Manage system users</p></div>
        </div>
        <a th:href="@{/admin/users/create}" class="btn btn-primary app-primary-btn"><i class="bi bi-person-plus"></i> Add User</a>
    </div>
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <section class="data-card">
        <div class="card-toolbar">
            <div><h2>User list</h2><p><strong th:text="${totalUsers}">0</strong> total users</p></div>
        </div>
        <form th:action="@{/admin/users}" method="get" class="search-form">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search username, name, or email">
                <input type="hidden" name="size" th:value="${size}">
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </form>
        <div class="table-responsive">
            <table class="table app-table mb-0">
                <thead><tr><th>ID</th><th>Avatar</th><th>Username</th><th>Full Name</th><th>Email</th><th>Role</th><th>Enabled</th><th>Products</th><th class="text-end">Actions</th></tr></thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td><img th:src="${!#strings.isEmpty(user.image) ? user.image : '/images/avatar-placeholder.png'}" alt="User avatar" class="avatar"></td>
                    <td class="fw-semibold" th:text="${user.username}"></td>
                    <td th:text="${user.fullname}"></td>
                    <td th:text="${user.email}"></td>
                    <td><span class="role-badge" th:classappend="${user.role == 'ADMIN'} ? ' role-admin' : ' role-user'" th:text="${user.role}"></span></td>
                    <td><span th:class="${user.enabled == false ? 'badge text-bg-secondary' : 'badge text-bg-success'}" th:text="${user.enabled == false ? 'Disabled' : 'Enabled'}"></span></td>
                    <td th:text="${productCounts.getOrDefault(user.id, 0L)}">0</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary me-1" th:href="@{/admin/users/edit/{id}(id=${user.id})}"><i class="bi bi-pencil"></i> Edit</a>
                        <form th:if="${currentUser == null or currentUser.id != user.id}" th:action="@{/admin/users/delete/{id}(id=${user.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Delete</button>
                        </form>
                        <span th:if="${currentUser != null and currentUser.id == user.id}" class="text-muted small">Current account</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}"><td colspan="9" class="text-center text-muted py-4">No users found.</td></tr>
                </tbody>
            </table>
        </div>
        <nav class="mt-3" th:if="${userPage.totalPages > 1}" aria-label="User pagination">
            <ul class="pagination justify-content-center mb-0">
                <li class="page-item" th:classappend="${userPage.first} ? ' disabled'">
                    <a class="page-link" th:href="@{/admin/users(page=${userPage.number - 1},size=${size},keyword=${keyword})}">Previous</a>
                </li>
                <li class="page-item" th:each="pageNumber : ${#numbers.sequence(0, userPage.totalPages - 1)}" th:classappend="${pageNumber == userPage.number} ? ' active'">
                    <a class="page-link" th:text="${pageNumber + 1}" th:href="@{/admin/users(page=${pageNumber},size=${size},keyword=${keyword})}">1</a>
                </li>
                <li class="page-item" th:classappend="${userPage.last} ? ' disabled'">
                    <a class="page-link" th:href="@{/admin/users(page=${userPage.number + 1},size=${size},keyword=${keyword})}">Next</a>
                </li>
            </ul>
        </nav>
    </section>
</div>
</body>
</html>
