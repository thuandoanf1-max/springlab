<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Forgot Password | SpringLab</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="login-page"><main class="login-shell"><section class="login-form-panel"><div class="login-card"><h2>Forgot password</h2><p>Enter your account email to receive a reset code.</p><form th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}" method="post"><input th:field="*{email}" type="email" placeholder="Email" class="form-control mb-2"><span th:errors="*{email}" class="error"></span><button class="btn btn-primary w-100" type="submit">Send reset code</button></form><p class="mt-3"><a th:href="@{/login}">Back to login</a></p></div></section></main></body></html>
