<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <nav th:fragment="header" class="navbar navbar-expand-lg app-navbar">
        <div class="container-fluid app-navbar-inner">
            <a class="navbar-brand app-brand" th:href="@{/}">
                <span class="brand-mark"><i class="bi bi-boxes"></i></span><span>SpringLab <strong>Admin</strong></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavigation" aria-controls="adminNavigation" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="adminNavigation">
                <ul class="navbar-nav me-auto app-nav-links">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}"><i class="bi bi-house"></i> Home</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin/categories}"><i class="bi bi-tags"></i> Categories</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin/products}"><i class="bi bi-box-seam"></i> Products</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin/users}"><i class="bi bi-people"></i> Users</a></li>
                </ul>
                <div class="navbar-profile" sec:authorize="isAuthenticated()">
                    <img th:src="${currentUser != null and !#strings.isEmpty(currentUser.image) ? currentUser.image : '/images/avatar-placeholder.png'}" alt="Profile avatar" class="avatar" />
                    <span class="profile-welcome">Welcome, <strong th:text="${currentUser != null ? currentUser.fullname : #authentication.name}">User</strong> <small th:if="${currentUser != null}" th:text="${currentUser.role}">ROLE</small></span>
                    <form th:action="@{/logout}" method="post" class="d-inline"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="logout-link border-0 bg-transparent"><i class="bi bi-box-arrow-right"></i> Logout</button></form>
                </div>
                <a class="login-link" sec:authorize="isAnonymous()" th:href="@{/login}">Login</a>
            </div>
        </div>
    </nav>
</body>
</html>
