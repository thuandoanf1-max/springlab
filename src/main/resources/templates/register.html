<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Register | SpringLab</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="login-page"><main class="login-shell"><section class="login-form-panel"><div class="login-card"><h2>Create account</h2><form th:action="@{/register}" th:object="${registerRequest}" method="post"><p th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}" class="error"></p><input th:field="*{username}" placeholder="Username" class="form-control mb-2"><span th:errors="*{username}" class="error"></span><input th:field="*{fullname}" placeholder="Full name" class="form-control mb-2"><span th:errors="*{fullname}" class="error"></span><input th:field="*{email}" placeholder="Email" class="form-control mb-2"><span th:errors="*{email}" class="error"></span><input th:field="*{password}" type="password" placeholder="Password" class="form-control mb-2"><span th:errors="*{password}" class="error"></span><input th:field="*{confirmPassword}" type="password" placeholder="Confirm password" class="form-control mb-2"><span th:errors="*{confirmPassword}" class="error"></span><button class="btn btn-primary w-100" type="submit">Register</button></form><p><a th:href="@{/login}">Already have an account? Login</a></p></div></section></main></body></html>
