<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Reset Password | SpringLab</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="login-page"><main class="login-shell"><section class="login-form-panel"><div class="login-card"><h2>Reset password</h2><p th:if="${message}" th:text="${message}"></p><p th:if="${error}" th:text="${error}" class="error"></p><form th:action="@{/reset-password}" th:object="${resetPasswordRequest}" method="post"><p th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}" class="error"></p><input th:field="*{email}" type="email" placeholder="Email" class="form-control mb-2"><span th:errors="*{email}" class="error"></span><input th:field="*{otp}" placeholder="6-digit OTP" class="form-control mb-2"><span th:errors="*{otp}" class="error"></span><input th:field="*{password}" type="password" placeholder="New password" class="form-control mb-2"><span th:errors="*{password}" class="error"></span><input th:field="*{confirmPassword}" type="password" placeholder="Confirm new password" class="form-control mb-2"><span th:errors="*{confirmPassword}" class="error"></span><button class="btn btn-primary w-100" type="submit">Reset password</button></form><form th:action="@{/forgot-password/resend-otp}" method="post" class="mt-2"><input type="hidden" name="email" th:value="${resetPasswordRequest.email}"><button class="btn btn-light w-100" type="submit">Resend OTP</button></form></div></section></main></body></html>
