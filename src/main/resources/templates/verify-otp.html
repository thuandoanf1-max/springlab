<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Verify OTP | SpringLab</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="login-page"><main class="login-shell"><section class="login-form-panel"><div class="login-card"><h2>Verify account</h2><p th:if="${message}" th:text="${message}"></p><p th:if="${error}" th:text="${error}" class="error"></p><form th:action="@{/verify-otp}" th:object="${verifyOtpRequest}" method="post"><p th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}" class="error"></p><input th:field="*{email}" type="email" class="form-control mb-2"><input th:field="*{code}" placeholder="6-digit OTP" class="form-control mb-2"><span th:errors="*{code}" class="error"></span><button class="btn btn-primary w-100">Verify</button></form><form th:action="@{/register/resend-otp}" method="post" class="mt-2"><input type="hidden" name="email" th:value="${verifyOtpRequest.email}"><button class="btn btn-light w-100">Resend OTP</button></form></div></section></main></body></html>
